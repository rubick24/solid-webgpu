<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Whale Animation</title>
    <style>
      * { box-sizing: border-box; }
      html, body, #app { width: 100%; height: 100%; margin: 0; }
      body { background: #07121d; color: #eaf6ff; font-family: system-ui, sans-serif; }
      main { width: 100%; height: 100%; display: grid; place-items: center; position: relative; }
      canvas { display: block; width: min(100vw, 177.78vh); height: auto; max-height: 100vh; }
      nav { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; }
      button { border: 1px solid #80b9d3; border-radius: 999px; padding: 10px 18px; background: #102638; color: inherit; cursor: pointer; }
      button[aria-pressed="true"] { background: #18708b; border-color: #a4e8ff; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
